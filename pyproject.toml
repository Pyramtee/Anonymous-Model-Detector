[project]
name = "tokenizer-detector"
version = "0.2.0"
description = "Detect which known vendor tokenizer an anonymous OpenRouter model uses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",
    "tokenizers>=0.20",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tokenizer-detector = "tokenizer_detector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenizer_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires all pinned reference artifacts, never accesses the network"]
